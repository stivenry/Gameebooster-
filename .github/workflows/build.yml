name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Compilar App V3 (Blindado Definitivo 3.0)
        run: |
          # 1. Descomprimir
          unzip -o -q *.zip
          
          # 2. Entrar a la carpeta correcta
          if [ -f "settings.gradle.kts" ]; then
            echo "El proyecto está en la raíz."
          else
            DIR=$(find . -maxdepth 2 -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
            echo "Entrando a la carpeta del proyecto: $DIR"
            cd "$DIR"
          fi
          
          # 3. Forzar AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 4. Inyectar Shizuku perfecto
          mkdir -p app/src/main/java/com/redmagic/boost
          cat << 'EOF' > app/src/main/java/com/redmagic/boost/ShizukuHelper.kt
          package com.redmagic.boost
          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          object ShizukuHelper {
              fun hasPermission(): Boolean {
                  return try {
                      if (Shizuku.isPreV11() || Shizuku.getVersion() < 11) return false
                      Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (e: Exception) { false }
              }
              fun runCommand(command: String): Boolean {
                  if (!hasPermission()) return false
                  return try {
                      val clazz = Class.forName("rikka.shizuku.Shizuku")
                      val method = clazz.getDeclaredMethod("newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                      method.isAccessible = true
                      val process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process
                      process.waitFor() == 0
                  } catch (e: Exception) { false }
              }
          }
          EOF
          
          # 5. Arreglar iconos
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@android:drawable\/sym_def_app_icon"/' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//' app/src/main/AndroidManifest.xml
          
          # 6. EL DESTRUCTOR DE ERRORES (Python)
          python3 -c "
          import os
          for root, dirs, files in os.walk('app/src/main/res/layout'):
              for file in files:
                  if file.endswith('.xml'):
                      path = os.path.join(root, file)
                      with open(path, 'r', encoding='utf-8') as f:
                          content = f.read()
                      if 'auto:' in content or 'xmlns:auto=' in content:
                          print(f'Parcheando: {path}')
                          content = content.replace('auto:', 'app:')
                          content = content.replace('xmlns:auto=', 'xmlns:app=')
                          # Inyectar el xmlns:app si no existe en la raíz del layout
                          if 'xmlns:app=' not in content:
                              content = content.replace('<LinearLayout', '<LinearLayout xmlns:app=\"http://schemas.android.com/apk/res-auto\"')
                              content = content.replace('<androidx.constraintlayout.widget.ConstraintLayout', '<androidx.constraintlayout.widget.ConstraintLayout xmlns:app=\"http://schemas.android.com/apk/res-auto\"')
                              content = content.replace('<com.google.android.material.card.MaterialCardView', '<com.google.android.material.card.MaterialCardView xmlns:app=\"http://schemas.android.com/apk/res-auto\"')
                              content = content.replace('<androidx.fragment.app.FragmentContainerView', '<androidx.fragment.app.FragmentContainerView xmlns:app=\"http://schemas.android.com/apk/res-auto\"')
                          with open(path, 'w', encoding='utf-8') as f:
                              f.write(content)
          "
          
          # 7. Verificar que ya no quede ningún "auto:"
          echo "Verificando si quedan errores de auto:"
          grep -r "auto:" app/src/main/res/layout/ || echo "¡Limpio! Ya no hay errores auto:"
          
          # 8. Compilar
          gradle assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: RedMagicBoost-apk
          path: "**/app-debug.apk"
