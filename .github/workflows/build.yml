name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
          
      - name: Compilar App V3 (Blindado Definitivo 2.0)
        run: |
          # 1. Descomprimir
          unzip -o -q *.zip
          
          # 2. Buscar la carpeta real del proyecto y entrar en ella
          PROJECT_DIR=$(find . -name "settings.gradle.kts" -exec dirname {} \; | head -n 1)
          echo "Entrando a la carpeta del proyecto: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          # 3. Forzar AndroidX
          echo "android.useAndroidX=true" > gradle.properties
          echo "android.enableJetifier=true" >> gradle.properties
          
          # 4. Inyectar Shizuku perfecto
          mkdir -p app/src/main/java/com/redmagic/boost
          cat << 'EOF' > app/src/main/java/com/redmagic/boost/ShizukuHelper.kt
          package com.redmagic.boost
          import android.content.pm.PackageManager
          import rikka.shizuku.Shizuku
          object ShizukuHelper {
              fun hasPermission(): Boolean {
                  return try {
                      if (Shizuku.isPreV11() || Shizuku.getVersion() < 11) return false
                      Shizuku.checkSelfPermission() == PackageManager.PERMISSION_GRANTED
                  } catch (e: Exception) { false }
              }
              fun runCommand(command: String): Boolean {
                  if (!hasPermission()) return false
                  return try {
                      val clazz = Class.forName("rikka.shizuku.Shizuku")
                      val method = clazz.getDeclaredMethod("newProcess", Array<String>::class.java, Array<String>::class.java, String::class.java)
                      method.isAccessible = true
                      val process = method.invoke(null, arrayOf("sh", "-c", command), null, null) as Process
                      process.waitFor() == 0
                  } catch (e: Exception) { false }
              }
          }
          EOF
          
          # 5. Arreglar iconos
          sed -i 's/android:icon="@mipmap\/ic_launcher"/android:icon="@android:drawable\/sym_def_app_icon"/' app/src/main/AndroidManifest.xml
          sed -i 's/android:roundIcon="@mipmap\/ic_launcher_round"//' app/src/main/AndroidManifest.xml
          
          # 6. PARCHE MAESTRO: Reemplazar auto: por app: y arreglar los namespaces
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/auto:/app:/g' {} +
          find app/src/main/res/layout -name "*.xml" -exec sed -i 's/xmlns:auto=/xmlns:app=/g' {} +
          
          # 7. Asegurarnos de que "xmlns:app" exista en la raíz de los layouts
          for file in app/src/main/res/layout/*.xml; do
            if grep -q "app:" "$file" && ! grep -q "xmlns:app=" "$file"; then
              sed -i 's/<LinearLayout/<LinearLayout xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/' "$file"
              sed -i 's/<RelativeLayout/<RelativeLayout xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/' "$file"
              sed -i 's/<androidx.constraintlayout.widget.ConstraintLayout/<androidx.constraintlayout.widget.ConstraintLayout xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/' "$file"
              sed -i 's/<com.google.android.material.card.MaterialCardView/<com.google.android.material.card.MaterialCardView xmlns:app="http:\/\/schemas.android.com\/apk\/res-auto"/' "$file"
            fi
          done
          
          # 8. Compilar
          gradle assembleDebug --no-daemon
          
      - uses: actions/upload-artifact@v4
        with:
          name: RedMagicBoost-apk
          path: "**/app-debug.apk"
